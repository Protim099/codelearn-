{% extends "base.html" %}{% block title %}Sign up{% endblock %}
{% block content %}<div class="container py-5" style="max-width:560px">
<div class="card"><div class="card-body p-4"><h1 class="h3 mb-3 text-center">Create your account</h1>
<form method="post" novalidate>{% csrf_token %}{% include "partials/_form.html" %}<button class="btn btn-primary w-100" type="submit">Sign up</button></form>
<p class="text-center small mt-3 mb-0">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p></div></div></div>{% endblock %}
