{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<div class="container py-5" style="max-width:440px">
<div class="card"><div class="card-body p-4"><h1 class="h3 mb-3 text-center">Welcome back</h1>
<form method="post" novalidate>{% csrf_token %}{% include "partials/_form.html" %}<input type="hidden" name="next" value="{{ next }}">
<button class="btn btn-primary w-100" type="submit">Log in</button></form>
<p class="text-center small mt-3 mb-0">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p></div></div></div>{% endblock %}
